[project]
name = "tradingagents"
version = "0.1.0"
description = "Multi-Agent LLM Financial Trading Framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "TradingAgents Team", email = "yijia.xiao@cs.ucla.edu"}
]
keywords = ["trading", "agents", "llm", "finance", "quantitative"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "langchain>=0.1.0",
    "langchain-openai>=0.0.2",
    "langchain-anthropic>=0.3.15",
    "langchain-google-genai>=2.1.5",
    "langchain-experimental>=0.0.40",
    "langgraph>=0.0.20",
    "chromadb>=1.0.12",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "yfinance>=0.2.31",
    "stockstats>=0.6.5",
    "praw>=7.7.0",
    "feedparser>=6.0.11",
    "finnhub-python>=2.4.23",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "questionary>=2.0.1",
    "tqdm>=4.67.1",
    "requests>=2.32.0",
    "pytz>=2025.2",
    "typing-extensions>=4.14.0",
    # Web UI & API
    "chainlit>=2.5.5",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    # Optional: broker integration
    "alpaca-trade-api>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]
broker = [
    "alpaca-trade-api>=3.0.0",
]
mcp = [
    "mcp>=1.0.0",
]

[project.scripts]
tradingagents = "cli.main:app"
tradingagents-api = "tradingagents.api.server:run_server"
tradingagents-web = "tradingagents.app:run_web"

[project.urls]
Homepage = "https://github.com/TauricResearch/TradingAgents"
Documentation = "https://github.com/TauricResearch/TradingAgents#readme"
Repository = "https://github.com/TauricResearch/TradingAgents"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tradingagents", "cli"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
